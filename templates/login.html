{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #261CC1 0%, #F1FF5E 100%);">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🏪</div>
            <h2 class="text-3xl font-bold text-gray-800">نظام إدارة السوبر ماركت</h2>
            <p class="text-gray-500 mt-2">تسجيل الدخول إلى النظام</p>
        </div>
        
        <form method="POST">
            <!-- ✅ دعم CSRF في Jinja2 -->
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">اسم المستخدم</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">كلمة المرور</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="w-full text-white font-bold py-2 px-4 rounded-lg transition duration-200" style="background: linear-gradient(135deg, #261CC1 0%, #F1FF5E 100%); hover:opacity-90">دخول</button>
        </form>
        
        <div class="mt-4 text-center text-sm text-gray-500">
            <p>الدخول التجريبي: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
