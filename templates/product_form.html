{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto font-cairo">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-brand-dark p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                {% if product %}
                <i class="fas fa-edit text-brand-gold"></i> تعديل منتج: {{ product.name }}
                {% else %}
                <i class="fas fa-plus-circle text-brand-gold"></i> إضافة منتج جديد
                {% endif %}
            </h1>
            <p class="text-xs text-brand-secondary/60 mt-1">يرجى ملء كافة الحقول المطلوبة لضمان دقة البيانات</p>
        </div>

        <form method="POST" class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- اسم المنتج -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-brand-dark mb-2">اسم المنتج <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="text" name="name" required value="{{ product.name if product else '' }}" 
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none transition"
                            placeholder="مثال: حليب كامل الدسم 1 لتر">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-300">
                            <i class="fas fa-tag"></i>
                        </div>
                    </div>
                </div>

                <!-- الفئة -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">الفئة</label>
                    <select name="category_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition appearance-none bg-no-repeat bg-[left_1rem_center]">
                        <option value="">-- بدون فئة --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- وحدة القياس -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">وحدة القياس</label>
                    <input type="text" name="unit" value="{{ product.unit if product else 'قطعة' }}" 
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition"
                        placeholder="قطعة، كيلو، كرتونة...">
                </div>

                <!-- سعر الشراء -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label class="block text-sm font-bold text-brand-dark mb-2">سعر الشراء <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="number" step="0.01" name="cost_price" required value="{{ product.cost_price if product else '' }}" 
                            class="w-full border border-gray-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand-gold outline-none transition text-left"
                            placeholder="0.00">
                        <span class="absolute right-3 top-2 text-gray-400">₪</span>
                    </div>
                </div>

                <!-- سعر البيع -->
                <div class="bg-brand-gold/5 p-4 rounded-xl border border-brand-gold/10">
                    <label class="block text-sm font-bold text-brand-primary mb-2">سعر البيع <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="number" step="0.01" name="selling_price" required value="{{ product.selling_price if product else '' }}" 
                            class="w-full border border-brand-gold/20 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand-gold outline-none transition text-left font-bold text-brand-primary"
                            placeholder="0.00">
                        <span class="absolute right-3 top-2 text-brand-gold">₪</span>
                    </div>
                </div>

                <!-- الكمية الحالية -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">الكمية الحالية في المخزن</label>
                    <input type="number" step="0.01" name="current_stock" value="{{ product.current_stock if product else '0' }}" 
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition text-left"
                        placeholder="0">
                </div>

                <!-- الحد الأدنى للمخزون -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2 text-red-500">تنبيه عند وصول الكمية لـ</label>
                    <input type="number" step="0.01" name="min_stock_level" value="{{ product.min_stock_level if product else '5' }}" 
                        class="w-full border border-red-100 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-500 outline-none transition text-left"
                        placeholder="5">
                </div>

                <!-- الباركود -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">رمز الباركود</label>
                    <div class="relative">
                        <input type="text" name="barcode" value="{{ product.barcode if product else '' }}" 
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition"
                            placeholder="أدخل الرمز أو امسح الباركود">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-barcode"></i>
                        </div>
                    </div>
                </div>

                <!-- تاريخ الانتهاء -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">تاريخ انتهاء الصلاحية</label>
                    <input type="date" name="expiry_date" value="{{ product.expiry_date.strftime('%Y-%m-%d') if product and product.expiry_date else '' }}" 
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition">
                </div>

                <!-- الوصف -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-brand-dark mb-2">ملاحظات إضافية</label>
                    <textarea name="description" rows="3" 
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-gold outline-none transition"
                        placeholder="أي تفاصيل أخرى حول المنتج...">{{ product.description if product else '' }}</textarea>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="flex flex-col md:flex-row gap-4 mt-10 border-t pt-8">
                <button type="submit" class="flex-1 bg-brand-primary text-white py-4 rounded-xl font-bold hover:bg-brand-dark transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 order-2 md:order-1">
                    <i class="fas fa-save"></i> حفظ بيانات المنتج
                </button>
                <a href="{{ url_for('products') }}" class="flex-1 bg-gray-100 text-gray-500 text-center py-4 rounded-xl font-bold hover:bg-gray-200 transition order-1 md:order-2">
                    إلغاء والعودة
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
